{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 mb-0">Candidates</h2>
    <a class="btn btn-sm btn-primary" href="/admin/dashboard">Back</a>
  </div>
  <table class="table table-striped">
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th></tr></thead>
    <tbody>
    {% for c in candidates %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone or '' }}</td>
        <td>{{ c.created_at }}</td>
      </tr>
    {% else %}
      <tr><td colspan="4">No candidates found.</td></tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
