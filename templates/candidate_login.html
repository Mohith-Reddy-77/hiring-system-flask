{% extends 'base.html' %}
{% block content %}
  <h2>Candidate Access</h2>
  <p class="muted">Enter your email to access your dashboard. No registration required.</p>
  <form method="post" action="/candidate/login" class="row g-3">
    <div class="col-12">
      <label class="form-label">Email</label>
      <input class="form-control" name="email" type="email" required>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Continue</button>
    </div>
  </form>
  {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
{% endblock %}
