{% extends 'base.html' %}
{% block content %}
  <h2>Candidate Register</h2>
  <form method="post" action="/candidate/register">
    <div><label>Full name: <input name="name" required></label></div>
    <div><label>Email: <input name="email" type="email" required></label></div>
    <div><label>Password: <input name="password" type="password" required></label></div>
    <div><button type="submit">Register</button></div>
  </form>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
{% endblock %}
